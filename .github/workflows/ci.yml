name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rangasso
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: rangasso_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rangasso -d rangasso_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rangasso:ci_only_password@localhost:5432/rangasso_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do agente (Linux)
        run: |
          npm -w apps/agent run typecheck
          npm -w apps/agent test
      - name: Typecheck e testes da API
        run: |
          npx tsc --noEmit -p apps/api/tsconfig.json
          npm -w apps/api test
      - name: Build do frontend
        run: npm -w apps/web run build

  agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do agente
        run: npm -w apps/agent test
      - name: Build e pacote do agente
        run: |
          npm -w apps/agent run build
          npm -w apps/agent run package:win
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $v = (Get-Content apps/agent/package.json | ConvertFrom-Json).version
          & $iscc "/DAppVersion=$v" "/DSourceDir=..\..\dist\RangassoAgent-$v" apps/agent/windows/installer/RangassoAgent.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Teste de fumaça no Windows (instalar, serviço, spooler, reinício, desinstalar)
        shell: pwsh
        run: |
          $v = (Get-Content apps/agent/package.json | ConvertFrom-Json).version
          ./apps/agent/windows/ci-smoke.ps1 -Setup (Resolve-Path "apps/agent/dist/RangassoAgentSetup-$v.exe")
      - name: Logs do teste
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem "$env:ProgramData\RangassoAgent" -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
          if (Test-Path C:\rg-out\setup.log) { Get-Content C:\rg-out\setup.log -Tail 40 }
      - uses: actions/upload-artifact@v4
        with:
          name: rangasso-agent-windows
          path: |
            apps/agent/dist/RangassoAgentSetup-*.exe
            apps/agent/dist/RangassoAgent-*-win-x64.zip
          retention-days: 14
