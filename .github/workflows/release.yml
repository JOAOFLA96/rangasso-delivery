name: Release do agente Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do agente
        run: npm -w apps/agent test
      - name: Build e pacote do agente
        run: |
          npm -w apps/agent run build
          npm -w apps/agent run package:win
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $v = (Get-Content apps/agent/package.json | ConvertFrom-Json).version
          & $iscc "/DAppVersion=$v" "/DSourceDir=..\..\dist\RangassoAgent-$v" apps/agent/windows/installer/RangassoAgent.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Teste de fumaça no Windows
        shell: pwsh
        run: |
          $v = (Get-Content apps/agent/package.json | ConvertFrom-Json).version
          ./apps/agent/windows/ci-smoke.ps1 -Setup (Resolve-Path "apps/agent/dist/RangassoAgentSetup-$v.exe")
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content apps/agent/package.json | ConvertFrom-Json).version
          $exe = "apps/agent/dist/RangassoAgentSetup-$v.exe"
          $zip = "apps/agent/dist/RangassoAgent-$v-win-x64.zip"
          Get-FileHash $exe, $zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content apps/agent/dist/SHA256SUMS.txt
          $notes = "Agente de impressão Rangasso $v para Windows 10/11 (64 bits). Instale com RangassoAgentSetup-$v.exe. O .zip é a versão portátil para instalação manual (install.ps1). Instruções: docs/AGENTE.md."
          gh release create "${{ github.ref_name }}" $exe $zip apps/agent/dist/SHA256SUMS.txt --title "Agente Windows $v" --notes $notes
