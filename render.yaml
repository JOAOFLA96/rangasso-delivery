# Blueprint do Render (plano grátis, para teste). Cria o site a partir do Dockerfile.
# O banco fica fora do Render: o Postgres grátis do Render expira em ~30 dias e apaga os dados.
# Use um Postgres externo (ex.: Neon grátis, conexão direta, sem "-pooler") e cole o endereço em DATABASE_URL.
# Limitações do plano grátis: o site "dorme" após 15 min sem acesso (~30 s para acordar) e o disco é
# temporário (fotos enviadas pelo painel somem quando o serviço reinicia).
# Para operar de verdade, use um plano pago ou a implantação em VPS (docs/IMPLANTACAO.md).
services:
  - type: web
    name: rangasso
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Endereço do Postgres externo (postgresql://...?sslmode=require). Preenchido no painel do Render.
      - key: DATABASE_URL
        sync: false
      - key: IP_HASH_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: João
      # Chave grátis do OpenRouteService: taxa por km pela rota de carro (sem ela, linha reta).
      - key: ORS_API_KEY
        sync: false
      # Chave do Google Maps (Routes API): endereço e distância pelas ruas, com prioridade sobre os serviços grátis.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # 99Food (Plataforma Aberta): credenciais do app aprovado no portal de desenvolvedores. Sem elas, integração desligada.
      - key: FOOD99_APP_ID
        sync: false
      - key: FOOD99_APP_SECRET
        sync: false
